version: '3.9'

# This is the OPTIONAL, fuller production stack: adds Redis + Celery worker/
# beat (background task queue) and HTTPS/443 on nginx, on top of the base
# setup in docker-compose.yml.
#
# You likely don't need this to get the CRM running. The FastAPI app already
# runs its own in-process schedulers (see app/main.py: scheduler_loop,
# reminder_scheduler_loop, performance_scheduler_loop) which cover the same
# scheduled jobs without Celery/Redis. Use docker-compose.yml first; only
# switch to this file if you specifically want a separate task queue or are
# ready to configure HTTPS certificates.
#
# Requires a .env.prod file (see .env.prod.example in this folder) and,
# for the "nginx" service here, real certs mounted at ./certs.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fundingsathicrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8085:8085"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "900", "1"]
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=info", "-Q", "default"]
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    command: ["celery", "-A", "app.celery_app.celery", "beat", "--loglevel=info"]
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
