user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-js text/x-component text/x-cross-domain-policy;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream backend {
        server backend:8085;
    }

    upstream frontend {
        server frontend:80;
    }

    # ==================================================================
    # HTTPS REDIRECT
    # Redirect all HTTP traffic to HTTPS
    # ==================================================================
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ==================================================================
    # HTTPS SERVER
    # Production HTTPS endpoint for api.YOUR-DOMAIN.com
    # ==================================================================
    server {
        listen 443 ssl http2 default_server;
        server_name YOUR-DOMAIN.com api.YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

        # ═══════════════════════════════════════════════════════════════
        # SSL CERTIFICATES
        # 
        # IMPORTANT: Before running this config, obtain SSL certificates.
        # Options:
        #
        # 1. Let's Encrypt (Recommended - Free)
        #    On the VPS, run:
        #    
        #    sudo apt-get install certbot python3-certbot-nginx
        #    sudo certbot certonly --standalone -d api.YOUR-DOMAIN.com
        #    sudo certbot certonly --standalone -d YOUR-DOMAIN.com
        #
        #    This creates:
        #    /etc/letsencrypt/live/api.YOUR-DOMAIN.com/fullchain.pem
        #    /etc/letsencrypt/live/api.YOUR-DOMAIN.com/privkey.pem
        #
        # 2. Or copy existing certs from elsewhere
        #
        # RENEWAL: Certbot auto-renews before expiry (keep running)
        # ═══════════════════════════════════════════════════════════════

        # SSL Certificate paths - Update YOUR-DOMAIN.com accordingly
        ssl_certificate /etc/letsencrypt/live/api.YOUR-DOMAIN.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.YOUR-DOMAIN.com/privkey.pem;

        # SSL Configuration (strong security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Client upload limits
        client_max_body_size 100M;

        # ==============================================================
        # ROUTING STRATEGY
        #
        # Route by what the FRONTEND is (static files), not by what
        # the backend is. Anything that isn't a static asset (HTML, CSS,
        # JS, images) goes to the backend API.
        # ==============================================================

        # Backend JSON endpoints that might be caught by static rules
        location = /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files served by frontend nginx container
        location ~ \.(html|css|js|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Everything else → Backend API
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed by your app)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
