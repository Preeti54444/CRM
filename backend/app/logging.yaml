version: 1
disable_existing_loggers: False
formatters:
  detailed:
    format: '%(asctime)s %(levelname)s [%(name)s] %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: detailed
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: detailed
    filename: ./logs/backend.log
    maxBytes: 10485760
    backupCount: 5
    level: INFO
root:
  level: INFO
  handlers: [console, file]
loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: no
  app:
    level: INFO
    handlers: [console, file]
    propagate: no
